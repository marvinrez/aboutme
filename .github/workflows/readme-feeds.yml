name: Update latest writing

on:
  schedule:
    - cron: "17 9 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Latest Medium posts
        uses: gautamkrishnar/blog-post-workflow@v1
        with:
          comment_tag_name: MEDIUM
          feed_list: "https://marcosrezende.medium.com/feed"
          max_post_count: 4
          commit_message: "Update latest writing"
